auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
# @adrianeyre/email-client is published by its own repo, so a new version is taken at once rather than after the
# minimum release age.
minimumReleaseAgeExclude:
  - "@adrianeyre/email-client@0.1.0"
# testcontainers' archiver takes glob 10 (GHSA-3g3m-2fjr-6pw4, fixed from glob 14.0.2), and glob 10 takes minimatch 9
# (GHSA-g3hv-75wg-m249, fixed from minimatch 11.0.1). glob 14 takes minimatch 11, and archiver-utils calls only
# glob.sync, which glob 14 keeps.
overrides:
  "glob@>=9.0.0 <14.0.2": ^14.0.2
# Last: the I6 probe appends its own entry to allowBuilds at the end of this file.
allowBuilds:
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false
