name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# packages: read installs @adrianeyre/email-client from GitHub Packages.
permissions:
  contents: read
  packages: read

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          # Writes a user-level .npmrc that logs in to GitHub Packages with NODE_AUTH_TOKEN, for
          # @adrianeyre/email-client: pnpm takes no token from the repository's own .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: "@adrianeyre"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run prettier
      - run: pnpm test

  dependency-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: pnpm audit --audit-level=high

  dependency-review:
    # GitHub refuses dependency review (403) on a private repository without Advanced Security; the dependency-advisories job is the gate.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          allow-ghsas: GHSA-fc5q-39xc-vjpf
