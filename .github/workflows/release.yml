name: Release

# Runs when a pull request is merged into main. semantic-release sets
# package.json's version, commits it to main as `chore(release): X.Y.Z [skip ci]`,
# tags that commit and makes a GitHub Release. The ruleset on main blocks only
# deletion and force pushes, so the GITHUB_TOKEN can push the release commit, and
# a push by the GITHUB_TOKEN starts no workflow, so the commit doesn't release again.
on:
  push:
    branches: [main]

# packages: read installs @adrianeyre/email-client from GitHub Packages.
permissions:
  contents: write
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          # Writes a user-level .npmrc that logs in to GitHub Packages with NODE_AUTH_TOKEN, for
          # @adrianeyre/email-client: pnpm takes no token from the repository's own .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: "@adrianeyre"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
